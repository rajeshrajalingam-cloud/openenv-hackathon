[project]
name = "openenv-hackathon"
version = "0.1.0"
description = "Adaptive project management OpenEnv environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai",
  "pydantic",
  "openenv-core",
  "python-dotenv",
  "fastapi",
  "uvicorn"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"